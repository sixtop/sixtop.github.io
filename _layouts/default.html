<!DOCTYPE html>
<html>
  <head>
    <!--<title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>-->
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <script src="{{ site.baseurl }}/js/jquery-3.6.0.min.js"></script>
    <script type="text/javascript">
      function set_body_top_margin() {
          // Div after floating div should start at the right place
          var menuHeight = $("#masthead-fixed").height();
          $("#wrapper-masthead").css("height", menuHeight);

          // Floating menu when we have enough screen realstate
          var screenWidth = $(window).height();
          if ( screenWidth < 800) {
              $("#masthead-fixed").css("position", "inherit");
              $("#masthead-fixed").css("z-index", "999");
              $("#masthead-fixed").css("left", "0px");
              $("#masthead-fixed").css("transform", "inherit");
          }
          else {
              $("#masthead-fixed").css("position", "fixed");
              $("#masthead-fixed").css("z-index", "999");
              $("#masthead-fixed").css("left", "50%");
              $("#masthead-fixed").css("transform", "translate(-50%, 0)");
          }
      }

      // change navbar bahavior on load and resize
      $(document).ready(set_body_top_margin);
      $(window).resize(set_body_top_margin);
    </script>
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="stylesheet" type="text/css" href="{{site.url}}/css/jekyll-photo-gallery.css">
    <link rel="stylesheet" href="{{ site.url }}/css/justifiedGallery.min.css">
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>
    <div id="wrapper-masthead">
      <div id="masthead-fixed" class="container ">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/index.html" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/index.html">{{ site.name }}</a></h1>
            <!--<p class="site-description">{{ site.description }}</p>-->
          </div>

          <nav>
            <a href="{{ site.baseurl }}/photography/">Gallery</a>
            <a href="{{ site.baseurl }}/about/">About</a>
            <a href="{{ site.baseurl }}/contact/">Contact</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>

  <!--<script src="{{ site.url }}/js/vendor/jquery-1.9.1.min.js"></script>-->
  <script src="{{ site.url }}/js/plugins/jquery.justifiedGallery.min.js"></script>
</html>
